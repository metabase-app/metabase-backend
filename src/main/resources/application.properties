spring.application.name=metabase-backend

# HTTP session and database
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.datasource.url=jdbc:postgresql://localhost:5432/metabase
spring.datasource.username=metabase
spring.datasource.password=metabase
spring.flyway.enabled=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# GraphQL
spring.graphql.graphiql.enabled=true
metabase.graphql.max-query-depth=${GRAPHQL_MAX_QUERY_DEPTH:20}
metabase.graphql.max-query-complexity=${GRAPHQL_MAX_QUERY_COMPLEXITY:500}
metabase.auth.rate-limit.max-attempts=${AUTH_RATE_LIMIT_MAX_ATTEMPTS:10}
metabase.auth.rate-limit.window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
metabase.graphql.rate-limit.max-calls=${GRAPHQL_RATE_LIMIT_MAX_CALLS:60}
metabase.graphql.rate-limit.window-seconds=${GRAPHQL_RATE_LIMIT_WINDOW_SECONDS:60}

# External providers
metabase.tmdb.base-url=${TMDB_BASE_URL:https://api.themoviedb.org/3}
metabase.tmdb.access-token=${TMDB_ACCESS_TOKEN:}
