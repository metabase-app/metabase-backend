buildscript {
    dependencies {
        classpath 'org.flywaydb:flyway-database-postgresql:12.4.0'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.jooq.jooq-codegen-gradle' version '3.20.17'
    id 'org.flywaydb.flyway' version '12.4.0'
}

group = 'me.lewisblackburn'
version = '0.0.1-SNAPSHOT'

def databaseUrl = providers.gradleProperty('databaseUrl')
        .orElse('jdbc:postgresql://localhost:5432/metabase')
        .get()
def databaseUser = providers.gradleProperty('databaseUser').orElse('metabase').get()
def databasePassword = providers.gradleProperty('databasePassword').orElse('metabase').get()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'com.graphql-java:graphql-java-extended-scalars:24.0'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.flywaydb:flyway-database-postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'org.postgresql:postgresql'
    jooqCodegen 'org.postgresql:postgresql'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jooq-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-graphql-test'
    testImplementation 'org.springframework.graphql:spring-graphql-test:2.0.4'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
    testImplementation 'org.testcontainers:testcontainers:1.21.4'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

flyway {
    url = databaseUrl
    user = databaseUser
    password = databasePassword
    schemas = ['public']
    cleanDisabled = false
}

jooq {
    configuration {
        jdbc {
            driver = 'org.postgresql.Driver'
            url = databaseUrl
            user = databaseUser
            password = databasePassword
        }

        generator {
            database {
                name = 'org.jooq.meta.postgres.PostgresDatabase'
                inputSchema = 'public'
            }

            generate {
                deprecated = false
                implicitJoinPathsManyToMany = false
            }

            target {
                packageName = 'me.lewisblackburn.metabase.jooq'
                directory = 'build/generated-src/jooq/main'
            }
        }
    }
}

sourceSets {
    main {
        java {
            srcDir 'build/generated-src/jooq/main'
        }
    }
}

tasks.named('jooqCodegen') {
    dependsOn tasks.named('flywayMigrate')
}

tasks.named('compileJava') {
    dependsOn tasks.named('jooqCodegen')
}
